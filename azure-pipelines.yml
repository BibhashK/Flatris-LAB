# Node.js with Next.js / React
trigger:
- master

pool:
  vmImage: 'ubuntu-24.04'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

# If your code lives in a subfolder named "web", set workingDirectory here:
- script: |
    npm install --legacy-peer-deps
    npm run build
  workingDirectory: 'web'   # <-- Change this to your subfolder path, or remove this line if in the root
  displayName: 'Install dependencies and build'

- task: CopyFiles@2
  displayName: 'Stage build output'
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/web'  # Match your subfolder
    contents: |
      .next/**
      public/**
      package.json
    targetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish pipeline artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'drop'
    publishLocation: 'Container'