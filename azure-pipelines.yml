# Node.js with Next.js / React
# Continuous Integration pipeline: installs dependencies, builds static/server assets, and saves artifacts.

trigger:
- master

pool:
  vmImage: 'ubuntu-24.04'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    npm ci
    npm run build
  displayName: 'Install dependencies and build project'

- task: CopyFiles@2
  displayName: 'Stage build output'
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)'
    contents: |
      .next/**
      public/**
      package.json
      package-lock.json
    targetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish pipeline artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'drop'
    publishLocation: 'Container'